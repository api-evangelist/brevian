apis:
- name: Brevian MCP Server
  description: >-
    Brevian's hosted (remote) Model Context Protocol server, exposing
    revenue-execution context (knowledge, deals, conversations, pipeline) to
    MCP-capable agents. Access is gated by OAuth 2.1 (authorization_code +
    PKCE) with dynamic client registration; the advertised scope is
    brevian:read. Tools are not enumerable without a valid access token.
  humanURL: https://docs.brevian.ai/
  baseURL: https://app.brevian.ai/mcp
