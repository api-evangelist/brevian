aid: brevian
name: Brevian
description: >-
  Brevian is a Revenue Execution AI platform for enterprise sales teams. It
  operates across the full deal lifecycle — preparing reps before calls,
  guiding them in real time during conversations, automatically capturing deal
  context into the CRM, and detecting patterns across deals. Brevian connects
  product knowledge, deals, conversations, and pipeline into a single knowledge
  graph that sits on top of an existing stack (Salesforce or HubSpot for CRM,
  Gong or Chorus for conversation intelligence, Zoom, Google Meet, or Microsoft
  Teams for calls). It exposes a hosted Model Context Protocol (MCP) server so
  agents can access that revenue-execution context under OAuth. Founded by Vinay
  Wagh (CEO, ex-Databricks) and Anupreet Walia (CTO); backed by Felicis.
